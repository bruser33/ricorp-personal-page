services:
  - type: web
    name: ricorp-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      # El sitio se sirve en ricorp.cl (dominio propio sobre Pages), NO en
      # bruser33.github.io. Con solo el github.io acá, el preflight del
      # formulario de contacto desde ricorp.cl moría en 500 y el envío nunca
      # salía. Van los dos, y con y sin www: el origin que manda el navegador es
      # el de la barra de direcciones, no el del hosting.
      - key: ALLOWED_ORIGINS
        value: https://ricorp.cl,https://www.ricorp.cl,https://bruser33.github.io
      - key: MONGO_URI
        sync: false
      # Envío del formulario de contacto por Resend (vía recomendada: va por
      # HTTPS). Sin RESEND_API_KEY ni SMTP el endpoint responde 503 en Render
      # (la UI muestra el error reintentable). CONTACT_TO tiene default en el
      # código, pero se declara acá para cambiar el destinatario sin tocar el repo.
      - key: RESEND_API_KEY
        sync: false
      # Alternativa a Resend (solo se usa si NO hay RESEND_API_KEY): Gmail por
      # SMTP. OJO: el plan free de Render bloquea SMTP saliente.
      # SMTP_USER = la cuenta Gmail que envía; SMTP_PASS = una contraseña de
      # aplicación de esa cuenta (myaccount.google.com/apppasswords), no la
      # contraseña normal.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_TO
        sync: false
